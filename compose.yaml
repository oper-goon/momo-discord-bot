services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - pot-provider
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in your shell or private .env file}
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      DATABASE_URL: sqlite:///data/bot.db
      RUST_LOG: info,serenity=warn,songbird=warn,sqlx=warn
    command: ["--config", "/app/config/config.toml"]
    volumes:
      - momo-data:/data
      - ./config/config.toml:/app/config/config.toml:ro
    stop_grace_period: 20s
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0-deno
    init: true
    logging:
      driver: none
    restart: unless-stopped
volumes:
  momo-data:
