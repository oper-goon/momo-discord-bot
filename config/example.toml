[discord]
owners = []
default_prefix = "!"
prefix_commands = false
administrator_bypass = true

[commands]
mode = "guild"
development_guilds = [] # Set your private test guild ID before starting.

[database]
url = "sqlite://data/bot.db"
max_connections = 5

[music]
yt_dlp_path = "yt-dlp"
resolver_timeout_seconds = 30
idle_disconnect_seconds = 300
empty_channel_disconnect_seconds = 120
default_volume_percent = 100
max_queue_length = 500
max_playlist_import = 100

[download]
yt_dlp_path = "yt-dlp"
scan_messages = 25
timeout_seconds = 180
max_duration_seconds = 900
absolute_max_bytes = 524288000 # Safety ceiling; slash commands also honor Discord's reported limit.
allowed_domains = [
  "youtube.com",
  "youtu.be",
  "tiktok.com",
  "x.com",
  "twitter.com",
  "reddit.com",
  "v.redd.it",
  "instagram.com",
]

[social_embeds]
probe_timeout_seconds = 6
# Momo verifies Instagram Open Graph metadata in order and uses the first healthy provider.
instagram_providers = ["kkinstagram.com", "oginstagram.com", "vxinstagram.com"]

[logging]
format = "pretty"
