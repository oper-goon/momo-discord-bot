[discord]
owners = []
default_prefix = "!"
prefix_commands = false
administrator_bypass = true

[commands]
mode = "guild"
development_guilds = [] # Set your private test guild ID before starting.

[database]
url = "sqlite://data/bot.db"
max_connections = 5

[music]
yt_dlp_path = "yt-dlp"
resolver_timeout_seconds = 30
idle_disconnect_seconds = 300
empty_channel_disconnect_seconds = 120
default_volume_percent = 100
max_queue_length = 500
max_playlist_import = 100
easynews_enabled = false # EASYNEWS_ENABLED; credentials: EASYNEWS_USERNAME / EASYNEWS_PASSWORD (environment only)
torbox_enabled = false # TORBOX_ENABLED; credential: TORBOX_API_KEY (environment only)
torbox_cached_only = true # Mandatory; TORBOX_CACHED_ONLY=false is rejected
provider_priority = ["youtube", "easynews", "torbox"] # MUSIC_PROVIDER_PRIORITY (comma separated)
provider_timeout_seconds = 30 # MUSIC_PROVIDER_TIMEOUT; each search/resolution attempt
provider_cooldown_seconds = 120 # MUSIC_PROVIDER_COOLDOWN; shared circuit breaker
match_min_confidence = 0.85 # MUSIC_MATCH_MIN_CONFIDENCE; 0.5–1.0

[download]
yt_dlp_path = "yt-dlp"
scan_messages = 25
timeout_seconds = 180
max_duration_seconds = 900
absolute_max_bytes = 524288000 # Safety ceiling; slash commands also honor Discord's reported limit.
allowed_domains = [
  "youtube.com",
  "youtu.be",
  "tiktok.com",
  "x.com",
  "twitter.com",
  "reddit.com",
  "v.redd.it",
  "instagram.com",
]

[social_embeds]
probe_timeout_seconds = 6
# Momo verifies the media type in order and uses the first matching healthy provider.
instagram_providers = ["kkinstagram.com", "oginstagram.com", "d.oginstagram.com", "vxinstagram.com"]

[logging]
format = "pretty"
