[workspace]
resolver = "3"

[package]
name = "dave-interop-new"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "dave-interop-new"
path = "../shared/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
davey = { path = "../../../vendor/davey" }
openmls = "=0.8.3"
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"

[patch.crates-io]
davey = { path = "../../../vendor/davey" }
openmls_basic_credential = { path = "../../../vendor/openmls_basic_credential" }
openmls_rust_crypto = { path = "../../../vendor/openmls_rust_crypto" }

[profile.dev]
debug = 0
