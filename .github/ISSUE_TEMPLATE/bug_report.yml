name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Never include tokens, credentials, private configuration, databases or signed media URLs."
  - type: input
    id: version
    attributes:
      label: Version and installation method
      placeholder: "0.9.0, Docker Compose source build, Linux amd64"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or feature and expected versus actual behavior. Use dummy inputs.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Relevant error messages and environment details only. Inspect before sharing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private identifiers and signed links.
          required: true
