name: Documentation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/collect_docs_notices.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libopus-dev libssl-dev
      - name: Export registry without credentials or database
        run: cargo run --locked -p bot-app -- --export-command-reference /tmp/commands.json
      - name: Check generated references
        run: python scripts/generate_reference.py --registry /tmp/commands.json --check
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m mkdocs build --strict
      - run: python scripts/check_docs.py
      - name: Upload Pages artifact after release approval
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
