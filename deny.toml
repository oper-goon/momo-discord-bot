[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "Maintenance-only: chrono 0.4.45 retained by Poise Context::id/Serenity timestamps and Songbird 0.6.1 serde-aux defaults. Removing the Poise feature breaks existing picker IDs. No patched release or vulnerability reported by this advisory. Review parent features on change and by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2026-0441", reason = "Maintenance-only: pin-utils 0.1.1 is retained by Davey/OpenMLS js via fluvio-wasm-timer. OpenMLS native lifetime uses std::time and its fluvio import is wasm32-only. Native targets only; no patched release. Review dependency/target changes and by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2024-0388", reason = "Songbird 0.6 requires derivative at build time; no runtime vulnerability reported. Review by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2024-0384", reason = "OpenMLS via Songbird requires instant; only native std::time implementation is deployed. Review by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2026-0173", reason = "Transitive hax build macro dependency has no compatible maintained release; no runtime vulnerability reported. Review by 2026-12-20; see docs/security.md." },
]

[licenses]
