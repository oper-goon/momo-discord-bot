[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0207", reason = "Only consumer hpke-rs 0.6.1 uses one-shot shake256::<32/64>, never repeated incremental squeeze. Review on any dependency change and by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2026-0208", reason = "Only consumer hpke-rs 0.6.1 requests fixed 32/64-byte outputs, both divisible by 8; affected AVX2 output lengths are unreachable. Review on dependency change and by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2024-0388", reason = "Songbird 0.6 requires derivative at build time; no runtime vulnerability reported. Review by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2024-0384", reason = "OpenMLS via Songbird requires instant; only native std::time implementation is deployed. Review by 2026-12-20; see docs/security.md." },
  { id = "RUSTSEC-2026-0173", reason = "Transitive hax build macro dependency has no compatible maintained release; no runtime vulnerability reported. Review by 2026-12-20; see docs/security.md." },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

