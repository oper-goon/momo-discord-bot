[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/libcrux-secrets", "vendor/ringbuf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.9"
poise = { version = "0.7", default-features = false, features = ["cache", "chrono", "handle_panics"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "native_tls_backend"] }
songbird = { version = "0.6", default-features = false, features = ["driver", "gateway", "serenity", "native", "tungstenite"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
futures-util = "0.3"
symphonia = { version = "0.5", features = ["all"] }
bot-module-api = { version = "0.1.0", path = "crates/bot-module-api" }
bot-database = { version = "0.1.0", path = "crates/bot-database" }
bot-core = { version = "0.1.0", path = "crates/bot-core" }
module-general = { version = "0.1.0", path = "crates/module-general" }
module-admin = { version = "0.1.0", path = "crates/module-admin" }
module-moderation = { version = "0.1.0", path = "crates/module-moderation" }
module-utility = { version = "0.1.0", path = "crates/module-utility" }
module-music = { version = "0.1.0", path = "crates/module-music" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Backport the upstream AArch64 selector mask fix to the API-compatible release.
# See vendor/README.md for exact provenance and the four-line patch.
libcrux-secrets = { path = "vendor/libcrux-secrets" }
# Backport ringbuf's panic-safe consumer removal while Songbird requires 0.4.
# See vendor/README.md for provenance, scope, and removal conditions.
ringbuf = { path = "vendor/ringbuf" }



